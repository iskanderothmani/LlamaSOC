name: LlamaSOC tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run sample dataset
        run: PYTHONPATH=src python -m llamasoc.cli data/sample-events.jsonl --indicator 198.51.100.23
